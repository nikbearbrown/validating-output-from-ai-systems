<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-01 fig-desc-01"><title id="fig-title-01">ORM vs. PRM: One Signal at the End vs. One Per Step</title><desc id="fig-desc-01">Two panels over one five-step chain to a terminal answer. The ORM scores only the terminal; the PRM scores every step, flagging step two as low even though the final answer is correct — catching right-answer, wrong-reasoning.</desc><metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="09-process-reward-models" figure-number="01" date-generated="2026-05-29"/></metadata><rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
<defs><marker id="arrow9-1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#2a1a0e" stroke-width="1"/></marker></defs>
<text x="40" y="34" font-family="'EB Garamond',Georgia,serif" font-size="14" fill="#2a1a0e">An ORM scores only the answer; a PRM scores every step and can flag bad reasoning.</text>

<!-- ORM panel -->
<text x="40" y="72" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#2a1a0e">ORM &#8212; one signal at the end</text>
