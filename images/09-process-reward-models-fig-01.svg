<text x="580" y="316" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#2a1a0e">answer</text>
<g stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow9-1)">
<line x1="124" y1="312" x2="148" y2="312"/><line x1="214" y1="312" x2="238" y2="312"/>
