<rect x="240" y="348" width="64" height="10" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/><rect x="240" y="348" width="56" height="10" fill="#545454"/>
<rect x="330" y="348" width="64" height="10" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/><rect x="330" y="348" width="58" height="10" fill="#545454"/>
<rect x="420" y="348" width="64" height="10" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/><rect x="420" y="348" width="52" height="10" fill="#545454"/>
