<rect x="240" y="120" width="64" height="40"/><rect x="330" y="120" width="64" height="40"/>
<rect x="420" y="120" width="64" height="40"/>
</g>
<rect x="520" y="112" width="120" height="56" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
<text x="580" y="144" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#2a1a0e">answer</text>
<g stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow9-1)">
<line x1="124" y1="140" x2="148" y2="140"/><line x1="214" y1="140" x2="238" y2="140"/>
<line x1="304" y1="140" x2="328" y2="140"/><line x1="394" y1="140" x2="418" y2="140"/>
<line x1="484" y1="140" x2="518" y2="140"/>
</g>
<!-- one score bar on terminal only (blue->secondary) -->
<rect x="520" y="176" width="120" height="12" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
<rect x="520" y="176" width="104" height="12" fill="#545454"/>

<!-- PRM panel -->
<text x="40" y="244" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#2a1a0e">PRM &#8212; one signal per step</text>
<rect x="40" y="256" width="620" height="140" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
<g fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5">
<rect x="60" y="292" width="64" height="40"/>
<rect x="240" y="292" width="64" height="40"/><rect x="330" y="292" width="64" height="40"/>
<rect x="420" y="292" width="64" height="40"/>
</g>
<!-- step 2 flagged -->
