<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-05 fig-desc-05"><title id="fig-title-05">Single-Run vs. 8-Run Reliability Collapse</title><desc id="fig-desc-05">A zero-based bar chart. Single-run success reaches 60 percent; the same agent under an eight-run consistency requirement reaches only 25 percent — roughly a 2.4x collapse — so single-run benchmark numbers overstate production reliability.</desc><metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="07-validating-agentic-task-execution" figure-number="05" date-generated="2026-05-29"/></metadata><rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
<text x="40" y="34" font-family="'EB Garamond',Georgia,serif" font-size="14" fill="#2a1a0e">The same agent: 60% single-run success collapses to 25% under an 8-run requirement.</text>

