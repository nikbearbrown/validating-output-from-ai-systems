  <title id="fig-title-03">Compounding error — end-to-end reliability decays with chain length</title>
  <desc>A line chart with a zero-based y-axis. A flat reference line at 0.9 marks constant per-step reliability while the end-to-end curve 0.9^n decays from 0.35 at ten steps to 0.12 at twenty.</desc>
