<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-04 fig-desc-04"><title id="fig-title-04">Citation Corpus: Existence Rate Ceiling and Unsupported Share</title><desc id="fig-desc-04">Two quantitative marks on a zero-based axis to 100 percent. A bar shows the maximum citation existence rate near 47.5 percent. A range band spans roughly 50 to 90 percent, the share of responses not fully supported among citations that do exist.</desc><metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="04-validating-factual-claims" figure-number="04" date-generated="2026-05-29"/></metadata><rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
