<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-04 fig-desc-04"><title id="fig-title-04">Fatigue-aware vs. blanket approval</title><desc id="fig-desc-04">Two panels of equal total units. Blanket approval routes every decision to a human (all emphasis-colored). Risk-proportional approval batches most as auto-approved (gray) and surfaces only a few consequential actions to a human (emphasis).</desc><metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="10-human-validation-and-automation-bias" figure-number="04" date-generated="2026-05-29"/></metadata>
<rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
<text x="350" y="32" text-anchor="middle" font-family="'EB Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">Where human attention is spent</text>
<text x="350" y="52" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454">Same total volume, redistributed: blanket approval manufactures fatigue; risk-proportional approval conserves it</text>

<!-- divider -->
<line x1="350" y1="78" x2="350" y2="402" stroke="#D4D4D4" stroke-width="1"/>

