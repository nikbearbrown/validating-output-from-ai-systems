<svg viewBox="0 0 700 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-05a fig-desc-05a"><title id="fig-title-05a">Verify-by-Domain Decision Tree</title><desc id="fig-desc-05a">Three cascading decision diamonds choose a reasoning validator: deterministic oracle yes leads to proof checker or executor; otherwise comparable answer yes leads to self-consistency; otherwise labelable steps yes leads to a process reward model, no leads to human review. Model self-critique alone is drawn isolated and struck through as forbidden.</desc><metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="05-validating-reasoning-chains" figure-number="01" date-generated="2026-05-29"/></metadata><rect x="0" y="0" width="700" height="540" fill="#FFFFFF"/>
