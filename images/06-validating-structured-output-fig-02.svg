</defs>
<text x="40" y="40" font-family="'EB Garamond',Georgia,serif" font-size="20" fill="#2a1a0e">Constrained decoding</text>
<text x="40" y="62" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#545454">The grammar masks invalid tokens before sampling — invalid becomes impossible</text>

