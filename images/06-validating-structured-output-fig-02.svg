<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-06b fig-desc-06b"><title id="fig-title-06b">Constrained Decoding: Token Masking at Generation Time</title><desc id="fig-desc-06b">A single decode step reads left to right. The full candidate-token row passes through a grammar finite-state-machine mask. Grammar-violating tokens are blocked and zeroed; only grammar-valid tokens survive, and a sampling arrow draws only from those into the output slot, making invalid tokens impossible to sample.</desc><metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="06-validating-structured-output" figure-number="02" date-generated="2026-05-29"/></metadata><rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
