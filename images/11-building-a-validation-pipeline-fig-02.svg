<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-02 fig-desc-02"><title id="fig-title-02">Failure-mode to catching-layer matrix</title><desc id="fig-desc-02">An 8-by-4 grid mapping eight failure modes to four catching slices. Each mode has one marker in its primary catching slice. Four modes whose only catcher is a model or human slice are ringed, marking residual-by-construction risk.</desc><metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="11-building-a-validation-pipeline" figure-number="02" date-generated="2026-05-29"/></metadata>
<rect x="0" y="0" width="700" height="480" fill="#FFFFFF"/>
<text x="350" y="30" text-anchor="middle" font-family="'EB Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">Which slice catches which failure mode</text>
<text x="350" y="50" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454">Ringed modes have no deterministic catcher — residual risk by construction</text>

<!-- Column headers -->
<text x="295" y="84" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#2a1a0e">Deterministic</text>
<text x="385" y="84" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#2a1a0e">Automated</text>
<text x="475" y="84" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#2a1a0e">Judge / PRM</text>
<text x="565" y="84" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#2a1a0e">Human</text>

