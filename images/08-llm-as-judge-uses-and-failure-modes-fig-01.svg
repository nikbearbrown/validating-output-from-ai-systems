<!-- Position Bias: The Reorder That Flips the Winner | Book: Validating Output from AI Systems | Chapter: 08-llm-as-judge-uses-and-failure-modes | Figure: 01 | Generated: 2026-05-29 | Source: pantry/08-llm-as-judge-uses-and-failure-modes-cajal.md -->
<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-01 fig-desc-01"><title id="fig-title-01">Position Bias: The Reorder That Flips the Winner</title><desc id="fig-desc-01">Two panels share a judge. The identical two candidates are presented in one order, then swapped. The winner marker follows the top position rather than the candidate — so a measured winner can be an artifact of position, not quality.</desc><metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="08-llm-as-judge-uses-and-failure-modes" figure-number="01" date-generated="2026-05-29"/></metadata><rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
<defs><marker id="arrow8-1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#2a1a0e" stroke-width="1"/></marker></defs>
<text x="40" y="34" font-family="'EB Garamond',Georgia,serif" font-size="14" fill="#2a1a0e">Swap the order of the same two answers and the verdict can flip.</text>

<!-- LEFT PANEL -->
<text x="160" y="70" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#2a1a0e">order A-on-top</text>
<rect x="40" y="80" width="280" height="300" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
<!-- candidate A (red) top, B (secondary) bottom -->
<rect x="60" y="110" width="90" height="50" fill="#C8102E" stroke="#2a1a0e" stroke-width="1"/>
<text x="105" y="140" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#FFFFFF">answer A</text>
<rect x="60" y="220" width="90" height="50" fill="#545454" stroke="#2a1a0e" stroke-width="1"/>
<text x="105" y="250" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#FFFFFF">answer B</text>
<!-- judge -->
<polygon points="220,165 250,182 250,218 220,235 190,218 190,182" fill="#FFFFFF" stroke="#545454" stroke-width="1.5"/>
<text x="220" y="204" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#2a1a0e">judge</text>
<line x1="150" y1="135" x2="188" y2="180" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow8-1)"/>
<line x1="150" y1="245" x2="188" y2="220" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow8-1)"/>
<!-- verdict to top candidate -->
<path d="M250,182 C275,150 175,120 152,128" fill="none" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow8-1)"/>
<text x="270" y="130" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#2a1a0e">winner</text>
<!-- winner check on top candidate -->
<path d="M132,130 l6,7 l12,-16" stroke="#C8102E" stroke-width="2.5" fill="none"/>

<!-- RIGHT PANEL -->
<text x="540" y="70" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#2a1a0e">order B-on-top (swapped)</text>
<rect x="380" y="80" width="280" height="300" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
<!-- B top, A bottom -->
<rect x="400" y="110" width="90" height="50" fill="#545454" stroke="#2a1a0e" stroke-width="1"/>
<text x="445" y="140" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#FFFFFF">answer B</text>
<rect x="400" y="220" width="90" height="50" fill="#C8102E" stroke="#2a1a0e" stroke-width="1"/>
<text x="445" y="250" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#FFFFFF">answer A</text>
<polygon points="560,165 590,182 590,218 560,235 530,218 530,182" fill="#FFFFFF" stroke="#545454" stroke-width="1.5"/>
<text x="560" y="204" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#2a1a0e">judge</text>
<line x1="490" y1="135" x2="528" y2="180" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow8-1)"/>
<line x1="490" y1="245" x2="528" y2="220" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow8-1)"/>
<path d="M590,182 C615,150 515,120 492,128" fill="none" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow8-1)"/>
<text x="610" y="130" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#2a1a0e">winner</text>
<!-- now winner check on B (top) -->
<path d="M472,130 l6,7 l12,-16" stroke="#C8102E" stroke-width="2.5" fill="none"/>

<text x="350" y="406" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454">Same answers, only the order changed — the green winner-mark follows the top slot.</text>
</svg>
