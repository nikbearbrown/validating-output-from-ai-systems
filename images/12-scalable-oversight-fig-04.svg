<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-04 fig-desc-04"><title id="fig-title-04">Nested-Oversight Success vs. Capability Gap</title><desc id="fig-desc-04">A line chart with success rate on the vertical axis from zero. Nested scalable-oversight success declines as the overseen system's Elo advantage grows, falling below roughly 52 percent at about a 400 Elo gap, marked at the crossing. Presented as one study's example, not a law.</desc><metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="12-scalable-oversight" figure-number="04" date-generated="2026-05-29"/></metadata><rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
