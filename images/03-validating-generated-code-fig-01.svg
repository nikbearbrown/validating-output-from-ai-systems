<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-01">
  <title id="fig-title-01">The four-gate sieve — what each layer catches and misses</title>
  <desc>Generated code passes four ordered gates—compiler, tests, SAST, bounded diff review—each catching a defect class the previous gate let through, with narrowing meshes and no gate sufficient alone.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="03-validating-generated-code" figure-number="01" date-generated="2026-05-29"/></metadata>
  <defs>
