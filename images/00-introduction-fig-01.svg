<title id="fig-title-00i">The execution–judgment boundary</title>
<desc id="fig-desc-00i">Two panels split by a central boundary. The left panel holds a single box: execution, the cheap and delegable production of an artifact. An arrow crosses the boundary into the right panel, which stacks five judgment questions a human must answer before the artifact can be trusted: should it exist, is it right, does it fit the situation, what does it omit, and what consequences follow.</desc>
