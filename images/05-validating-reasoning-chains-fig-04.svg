<!-- The Validation Ladder | Book: Validating Output from AI Systems | Chapter: 05-validating-reasoning-chains | Figure: 04 | Generated: 2026-05-29 | Source: pantry/05-validating-reasoning-chains-cajal.md -->
<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-05d fig-desc-05d"><title id="fig-title-05d">The Validation Ladder: Three Rungs from None to Sound Oracle</title><desc id="fig-desc-05d">Three stacked rungs read bottom to top as increasing validation strength: a single greedy chain with no validation and a fragile dashed edge; self-consistency giving statistical robustness with a solid edge; PAL execution as a sound deterministic oracle with a heavy edge. An upward arrow spans the stack.</desc><metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="05-validating-reasoning-chains" figure-number="04" date-generated="2026-05-29"/></metadata><rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
<defs>
<marker id="arrow05d" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a1a0e"/></marker>
</defs>
<text x="40" y="40" font-family="'EB Garamond',Georgia,serif" font-size="20" fill="#2a1a0e">The validation ladder</text>
<text x="40" y="62" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#545454">One problem, three strengths — climb as high as ground truth lets you</text>

<!-- ascent arrow on the left spanning rungs -->
<line x1="110" y1="360" x2="110" y2="100" stroke="#2a1a0e" stroke-width="2" marker-end="url(#arrow05d)"/>
<text x="92" y="240" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#545454" transform="rotate(-90 92 240)">stronger validation  →</text>

<!-- Rung 1 (bottom): no validation, fragile dashed -->
<rect x="160" y="300" width="300" height="56" fill="#F5F5F5" stroke="#545454" stroke-width="1" stroke-dasharray="4 4"/>
<text x="180" y="325" font-family="'EB Garamond',Georgia,serif" font-size="15" fill="#2a1a0e">Single greedy chain</text>
<text x="180" y="344" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454">no validation — fragile</text>
<text x="450" y="332" font-family="'JetBrains Mono',monospace" font-size="9" fill="#545454" text-anchor="end">rung 1</text>

<!-- Rung 2 (middle): self-consistency, solid -->
<rect x="160" y="214" width="350" height="56" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1.5"/>
<text x="180" y="239" font-family="'EB Garamond',Georgia,serif" font-size="15" fill="#2a1a0e">Self-consistency</text>
<text x="180" y="258" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454">statistical robustness</text>
<text x="500" y="246" font-family="'JetBrains Mono',monospace" font-size="9" fill="#545454" text-anchor="end">rung 2</text>

<!-- Rung 3 (top): PAL execution, heavy edge, emphasis -->
<rect x="160" y="128" width="400" height="56" fill="#F5F5F5" stroke="#C8102E" stroke-width="3"/>
<text x="180" y="153" font-family="'EB Garamond',Georgia,serif" font-size="15" fill="#2a1a0e">PAL execution</text>
<text x="180" y="172" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454">sound deterministic oracle — strongest</text>
<text x="550" y="160" font-family="'JetBrains Mono',monospace" font-size="9" fill="#C8102E" text-anchor="end">rung 3</text>

<text x="160" y="388" font-family="'Inter',-apple-system,sans-serif" font-size="11.5" fill="#2a1a0e">Edge weight encodes strength: fragile dashed → solid → heavy. Not every problem reaches the top rung.</text>
</svg>
