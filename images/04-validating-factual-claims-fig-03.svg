<g stroke="#C8102E" stroke-width="1.5" fill="none"><line x1="242" y1="214" x2="242" y2="230"/><line x1="232" y1="218" x2="238" y2="228"/><line x1="252" y1="218" x2="246" y2="228"/><line x1="226" y1="226" x2="236" y2="230"/><line x1="258" y1="226" x2="248" y2="230"/></g>
