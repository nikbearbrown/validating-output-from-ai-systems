<path d="M242,276 C242,330 574,330 574,278" fill="none" stroke="#C8102E" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow04c)"/>
<text x="408" y="346" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#C8102E" text-anchor="middle">a wrong retrieval propagates straight to a confident, well-cited — but wrong — answer</text>

<text x="40" y="390" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#2a1a0e">Same failure object, relocated. The answer is only ever as correct as retrieval.</text>
