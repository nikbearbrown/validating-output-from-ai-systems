<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-03 fig-desc-03"><title id="fig-title-03">RAG Relocates the Failure: From Generator to Retriever</title><desc id="fig-desc-03">Two stacked panels share one left-to-right flow. Pre-RAG: query feeds a generator that confabulates, marked by a failure burst. Post-RAG: query feeds a retriever then the generator; the same failure burst has moved onto the retriever, and error propagates downstream.</desc><metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="04-validating-factual-claims" figure-number="03" date-generated="2026-05-29"/></metadata><rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
<defs>
<marker id="arrow04c" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a1a0e"/></marker>
</defs>
<text x="40" y="40" font-family="'EB Garamond',Georgia,serif" font-size="20" fill="#2a1a0e">RAG relocates the failure</text>
<text x="40" y="62" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#545454">The failure does not vanish — it moves upstream into retrieval</text>

<!-- Panel 1: Pre-RAG -->
