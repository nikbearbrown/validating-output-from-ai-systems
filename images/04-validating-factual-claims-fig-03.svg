<text x="304" y="137" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#2a1a0e" text-anchor="middle">Generator</text>
<!-- failure burst on generator -->
<g stroke="#C8102E" stroke-width="1.5" fill="none"><line x1="304" y1="92" x2="304" y2="108"/><line x1="294" y1="96" x2="300" y2="106"/><line x1="314" y1="96" x2="308" y2="106"/><line x1="288" y1="104" x2="298" y2="108"/><line x1="320" y1="104" x2="310" y2="108"/></g>
<text x="304" y="86" font-family="'JetBrains Mono',monospace" font-size="9" fill="#C8102E" text-anchor="middle">confabulates</text>
<line x1="364" y1="132" x2="474" y2="132" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow04c)"/>
<rect x="478" y="110" width="90" height="44" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1.2"/>
<text x="523" y="137" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#2a1a0e" text-anchor="middle">Answer</text>

<line x1="40" y1="178" x2="660" y2="178" stroke="#D4D4D4" stroke-width="1"/>

<!-- Panel 2: Post-RAG -->
<text x="40" y="222" font-family="'JetBrains Mono',monospace" font-size="11" fill="#545454">after</text>
