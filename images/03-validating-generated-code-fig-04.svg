<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-04">
  <title id="fig-title-04">Vulnerability density varies by language — budget review accordingly</title>
  <desc>A zero-based horizontal bar chart. AI-generated Python carries a file-level vulnerability rate roughly two-to-seven times that of TypeScript, with JavaScript between, justifying non-uniform review budgets.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="03-validating-generated-code" figure-number="04" date-generated="2026-05-29"/></metadata>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>

