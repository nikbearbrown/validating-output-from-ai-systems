  <text x="350" y="52" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="13" fill="#545454">Risk is not uniform: per-language rates span several-fold</text>

  <!-- plot region. value axis x: 0 at 200, scale 20% -> 620 (so 1%=21px) -->
  <rect x="200" y="90" width="420" height="240" fill="#F5F5F5"/>
  <line x1="200" y1="90" x2="200" y2="330" stroke="#2a1a0e" stroke-width="1.5"/>
