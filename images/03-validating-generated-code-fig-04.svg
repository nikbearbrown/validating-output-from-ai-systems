  <rect x="200" y="110" width="363" height="48" fill="#C8102E"/>
  <text x="190" y="140" text-anchor="end" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Python</text>
  <text x="573" y="140" text-anchor="start" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">~16–18.5%</text>

