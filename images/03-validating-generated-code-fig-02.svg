<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-02">
  <title id="fig-title-02">Coverage is not detection — the mutation-score gap</title>
  <desc>A zero-based bar chart. An AI-generated test suite shows high line coverage but a far lower mutation score; the wide gap between the two bars exposes coverage as execution without detection.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="03-validating-generated-code" figure-number="02" date-generated="2026-05-29"/></metadata>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>

  <text x="350" y="30" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">Validating Generated Code</text>
  <text x="350" y="52" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="13" fill="#545454">High coverage, low detection: the suite runs the code without catching what's wrong</text>

  <!-- plot region: y 0..100 -> pixels 350 (0) .. 90 (100) -->
  <rect x="120" y="90" width="460" height="260" fill="#F5F5F5"/>
  <line x1="120" y1="90" x2="120" y2="350" stroke="#2a1a0e" stroke-width="1.5"/>
  <line x1="120" y1="350" x2="580" y2="350" stroke="#2a1a0e" stroke-width="1.5"/>

  <!-- y ticks 0/50/100 -->
  <text x="112" y="354" text-anchor="end" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">0</text>
  <text x="112" y="224" text-anchor="end" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">50</text>
  <text x="112" y="94" text-anchor="end" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">100</text>
  <text x="56" y="220" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" transform="rotate(-90 56 220)">percent</text>

  <!-- coverage bar: ~88% -> height. y=350 zero; 88% -> 350-(88/100*260)=121.2 -->
  <rect x="200" y="121" width="120" height="229" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="2"/>
  <text x="260" y="111" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="12" fill="#2a1a0e">~88%</text>
  <text x="260" y="370" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Line coverage</text>

  <!-- mutation-score bar: ~46% -> 350-(46/100*260)=230.4 -->
  <rect x="400" y="230" width="120" height="120" fill="#C8102E" stroke="#C8102E" stroke-width="2"/>
  <text x="460" y="220" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="12" fill="#C8102E">~46%</text>
  <text x="460" y="370" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Mutation score</text>

  <!-- gap span marker between bar tops -->
  <line x1="345" y1="121" x2="345" y2="230" stroke="#545454" stroke-width="1.5"/>
  <line x1="340" y1="121" x2="350" y2="121" stroke="#545454" stroke-width="1.5"/>
  <line x1="340" y1="230" x2="350" y2="230" stroke="#545454" stroke-width="1.5"/>
  <text x="356" y="180" text-anchor="start" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">~40-point gap</text>

  <text x="350" y="402" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Coverage measures execution; mutation score measures detection — they are not the same thing.</text>
</svg>
