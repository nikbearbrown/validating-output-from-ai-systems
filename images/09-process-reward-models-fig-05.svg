<!-- PRM Localization in Search: Pruning the Bad Prefix | Book: Validating Output from AI Systems | Chapter: 09-process-reward-models | Figure: 05 | Generated: 2026-05-29 | Source: pantry/09-process-reward-models-cajal.md -->
<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-05 fig-desc-05"><title id="fig-title-05">PRM Localization in Search: Pruning the Bad Prefix</title><desc id="fig-desc-05">A top-down search tree with per-step score chips. An early low-scoring node is pruned with a cut glyph, leaving its subtree greyed and never expanded, while the high-scoring prefix continues to expand to a leaf.</desc><metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="09-process-reward-models" figure-number="05" date-generated="2026-05-29"/></metadata><rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
<defs><marker id="arrow9-5" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#2a1a0e" stroke-width="1"/></marker></defs>
<text x="40" y="34" font-family="'EB Garamond',Georgia,serif" font-size="14" fill="#2a1a0e">Per-step scores let search prune a bad prefix early instead of expanding it to a full failure.</text>

<!-- root -->
<circle cx="350" cy="80" r="20" fill="#545454" stroke="#2a1a0e" stroke-width="1.5"/>
<!-- level 1: two children -->
<line x1="338" y1="96" x2="222" y2="150" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow9-5)"/>
<line x1="362" y1="96" x2="478" y2="150" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow9-5)"/>
<!-- left child: low score, pruned -->
<circle cx="210" cy="168" r="20" fill="#FFFFFF" stroke="#C8102E" stroke-width="2"/>
<!-- low-score chip -->
<rect x="232" y="150" width="22" height="14" fill="#C8102E"/>
<!-- prune cut glyph on the edge below -->
<line x1="200" y1="190" x2="170" y2="250" stroke="#D4D4D4" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="220" y1="190" x2="250" y2="250" stroke="#D4D4D4" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="178" y1="206" x2="200" y2="218" stroke="#C8102E" stroke-width="2.5"/>
<text x="150" y="214" text-anchor="end" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#C8102E">pruned</text>
<!-- greyed unexpanded subtree -->
<circle cx="170" cy="262" r="16" fill="none" stroke="#D4D4D4" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="250" cy="262" r="16" fill="none" stroke="#D4D4D4" stroke-width="1.5" stroke-dasharray="3 3"/>

<!-- right child: high score, expands -->
<circle cx="490" cy="168" r="20" fill="#545454" stroke="#2a1a0e" stroke-width="1.5"/>
<rect x="512" y="150" width="22" height="14" fill="#545454"/>
<!-- level 2 children of right -->
<line x1="480" y1="184" x2="430" y2="248" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow9-5)"/>
<line x1="500" y1="184" x2="550" y2="248" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow9-5)"/>
<circle cx="420" cy="266" r="18" fill="#545454" stroke="#2a1a0e" stroke-width="1.5"/>
<rect x="440" y="250" width="20" height="12" fill="#545454"/>
<circle cx="560" cy="266" r="18" fill="#545454" stroke="#2a1a0e" stroke-width="1.5"/>
<rect x="580" y="250" width="20" height="12" fill="#545454"/>
<!-- continue surviving path to a leaf -->
<line x1="560" y1="284" x2="560" y2="328" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow9-5)"/>
<rect x="528" y="332" width="64" height="40" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
<text x="560" y="357" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#2a1a0e">leaf</text>

<!-- legend -->
<rect x="60" y="332" width="14" height="12" fill="#545454"/><text x="80" y="342" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#2a1a0e">high step score</text>
<rect x="60" y="350" width="14" height="12" fill="#C8102E"/><text x="80" y="360" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#2a1a0e">low step score (cut)</text>
<rect x="60" y="368" width="14" height="12" fill="none" stroke="#D4D4D4" stroke-width="1.5" stroke-dasharray="3 3"/><text x="80" y="378" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#2a1a0e">never expanded</text>
</svg>
