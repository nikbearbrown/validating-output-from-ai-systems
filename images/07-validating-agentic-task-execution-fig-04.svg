<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-04 fig-desc-04"><title id="fig-title-04">Error Propagation Through Steps</title><desc id="fig-desc-04">A left-to-right five-step chain. The first two steps are clean. A wrong-but-well-formed value originates at step three, marked by a fault wedge, and silently contaminates steps four and five with no error raised in between.</desc><metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="07-validating-agentic-task-execution" figure-number="04" date-generated="2026-05-29"/></metadata><rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
<defs><marker id="arrow7-4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#2a1a0e" stroke-width="1.2"/></marker>
<marker id="arrow7-4r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#C8102E" stroke-width="1.4"/></marker></defs>
<text x="40" y="34" font-family="'EB Garamond',Georgia,serif" font-size="14" fill="#2a1a0e">A wrong-but-well-formed value flows downstream as if valid — no error is raised.</text>

<rect x="40" y="160" width="620" height="100" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>

<!-- nodes -->
<!-- step1 clean -->
<g font-family="'Inter',-apple-system,sans-serif" font-size="12">
<rect x="60" y="184" width="84" height="52" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
<text x="102" y="214" text-anchor="middle" fill="#2a1a0e">step</text>
<rect x="184" y="184" width="84" height="52" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
<text x="226" y="214" text-anchor="middle" fill="#2a1a0e">step</text>
<!-- step3 fault origin -->
<rect x="308" y="184" width="84" height="52" fill="#FFFFFF" stroke="#C8102E" stroke-width="2"/>
<text x="350" y="214" text-anchor="middle" fill="#2a1a0e">step</text>
<!-- step4,5 contaminated -->
<rect x="432" y="184" width="84" height="52" fill="#FFFFFF" stroke="#C8102E" stroke-width="2"/>
<text x="474" y="214" text-anchor="middle" fill="#C8102E">step</text>
<rect x="556" y="184" width="84" height="52" fill="#FFFFFF" stroke="#C8102E" stroke-width="2"/>
<text x="598" y="214" text-anchor="middle" fill="#C8102E">step</text>
</g>
<!-- fault wedge on step 3 -->
<polygon points="308,184 332,184 308,208" fill="#C8102E"/>

<!-- clean arrows -->
<g stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#arrow7-4)">
<line x1="144" y1="210" x2="182" y2="210"/>
<line x1="268" y1="210" x2="306" y2="210"/>
</g>
<!-- contaminated arrows (red, solid = silent) -->
<g stroke="#C8102E" stroke-width="1.4" marker-end="url(#arrow7-4r)">
<line x1="392" y1="210" x2="430" y2="210"/>
<line x1="516" y1="210" x2="554" y2="210"/>
</g>

<!-- output tokens -->
<g fill="#545454">
<circle cx="163" cy="210" r="3"/>
<circle cx="287" cy="210" r="3"/>
</g>
<circle cx="411" cy="210" r="3" fill="#C8102E"/>
<circle cx="535" cy="210" r="3" fill="#C8102E"/>

<text x="350" y="296" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454">Solid (unbroken) arrows: the bad value is never caught — contamination is silent.</text>
<text x="350" y="320" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#2a1a0e">clean upstream &#8594; fault origin (step 3) &#8594; contaminated downstream</text>
</svg>
