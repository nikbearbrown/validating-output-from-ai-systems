<!-- Circularity: The Judge Shares the Generator's Blind Spot | Book: Validating Output from AI Systems | Chapter: 08-llm-as-judge-uses-and-failure-modes | Figure: 04 | Generated: 2026-05-29 | Source: pantry/08-llm-as-judge-uses-and-failure-modes-cajal.md -->
<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-04 fig-desc-04"><title id="fig-title-04">Circularity: The Judge Shares the Generator's Blind Spot</title><desc id="fig-desc-04">A generator and a judge are identical-shaped nodes fed by one shared training-and-objective region. The generator emits a wrong-but-fluent output carrying a fault wedge; the judge approves it, because the shared lineage makes the fault invisible.</desc><metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="08-llm-as-judge-uses-and-failure-modes" figure-number="04" date-generated="2026-05-29"/></metadata><rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
<defs><marker id="arrow8-4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#2a1a0e" stroke-width="1.2"/></marker></defs>
<text x="40" y="34" font-family="'EB Garamond',Georgia,serif" font-size="14" fill="#2a1a0e">The judge is the same kind of model as the generator — so a shared error stays invisible.</text>

<!-- generator -->
<rect x="90" y="110" width="140" height="64" fill="#545454" stroke="#2a1a0e" stroke-width="1.5"/>
<text x="160" y="148" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="13" fill="#FFFFFF">generator</text>
<!-- judge (identical shape + fill = same kind) -->
<rect x="470" y="110" width="140" height="64" fill="#545454" stroke="#2a1a0e" stroke-width="1.5"/>
<text x="540" y="148" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="13" fill="#FFFFFF">judge</text>

<!-- shared region below -->
<rect x="160" y="300" width="380" height="56" fill="#C8102E" fill-opacity="0.16" stroke="#C8102E" stroke-width="1.5"/>
<text x="350" y="333" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#C8102E">shared training data &amp; objectives</text>
<!-- common lineage arrows rising to both -->
<path d="M240,300 L200,176" fill="none" stroke="#C8102E" stroke-width="1.2" marker-end="url(#arrow8-4)"/>
<path d="M460,300 L500,176" fill="none" stroke="#C8102E" stroke-width="1.2" marker-end="url(#arrow8-4)"/>

<!-- faulted output between generator and judge -->
<rect x="310" y="118" width="80" height="48" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
<text x="350" y="147" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#2a1a0e">output</text>
<polygon points="310,118 334,118 310,142" fill="#C8102E"/>
<!-- generator -> output -->
<line x1="230" y1="142" x2="308" y2="142" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#arrow8-4)"/>
<!-- output -> judge -->
<line x1="390" y1="142" x2="468" y2="142" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#arrow8-4)"/>

<!-- approval marker back to output, closing the loop -->
<path d="M510,174 C520,230 410,230 392,180" fill="none" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow8-4)"/>
<path d="M412,206 l7,8 l14,-18" stroke="#C8102E" stroke-width="2.5" fill="none"/>
<text x="430" y="234" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#2a1a0e">approves</text>

<text x="350" y="392" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454">The same shared region feeds both, so the generator's fault is one the judge also holds.</text>
</svg>
