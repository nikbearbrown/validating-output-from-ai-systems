<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-05c fig-desc-05c"><title id="fig-title-05c">Self-Consistency: Sample, Diverge, Vote</title><desc id="fig-desc-05c">One prompt fans out into several independent reasoning paths. Most answer tokens converge onto a single majority node, tallied by a count; one or two idiosyncratic outliers scatter to separate nodes. Agreement correlates with correctness without any model self-assessment.</desc><metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="05-validating-reasoning-chains" figure-number="03" date-generated="2026-05-29"/></metadata><rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
