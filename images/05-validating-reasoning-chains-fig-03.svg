<text x="300" y="375" font-family="'Inter',-apple-system,sans-serif" font-size="11.5" fill="#2a1a0e" text-anchor="middle">Independent paths fan out; the majority is the answer — no self-assessment required.</text>
<text x="300" y="395" font-family="'Inter',-apple-system,sans-serif" font-size="10.5" fill="#545454" text-anchor="middle">(under shared bias, the convergence can be confidently wrong)</text>
