<text x="560" y="353" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#545454">thinnest</text>

<!-- trajectory: threads aligned holes at y=232 -->
<line x1="20" y1="232" x2="660" y2="232" stroke="#C8102E" stroke-width="2.5" marker-end="url(#arrowp1)"/>
