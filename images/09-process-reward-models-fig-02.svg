<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-02 fig-desc-02"><title id="fig-title-02">Monte-Carlo Step Labeling by Rollout</title><desc id="fig-desc-02">One origin step fans into five sampled continuations run to a final answer. Three reach the correct answer, two do not; the aggregator reads the empirical step value as three-fifths — a cheap but noisy survivability proxy.</desc><metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="09-process-reward-models" figure-number="02" date-generated="2026-05-29"/></metadata><rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
