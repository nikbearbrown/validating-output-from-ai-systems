<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-02 fig-desc-02"><title id="fig-title-02">Quality Gap Modulates Bias: Coarse vs. Close Call</title><desc id="fig-desc-02">Two aligned quality axes. With a wide gap the two candidates are far apart and the verdict zone around the clear winner is stable. Near a tie the candidates nearly coincide and the verdict zone is unstable and order-driven.</desc><metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="08-llm-as-judge-uses-and-failure-modes" figure-number="02" date-generated="2026-05-29"/></metadata><rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
<text x="40" y="34" font-family="'EB Garamond',Georgia,serif" font-size="14" fill="#2a1a0e">Judges are reliable on wide quality gaps; near a tie, the verdict is order-driven.</text>

<!-- TOP: wide gap -->
<text x="40" y="74" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#2a1a0e">wide quality gap &#8594; stable verdict</text>
<rect x="40" y="86" width="620" height="120" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
<!-- axis -->
<line x1="80" y1="160" x2="620" y2="160" stroke="#545454" stroke-width="1.5"/>
<text x="70" y="186" font-family="'JetBrains Mono',monospace" font-size="11" fill="#545454">lower</text>
<text x="620" y="186" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="11" fill="#545454">higher quality</text>
<!-- stable verdict zone around the higher marker (red emphasis) -->
<rect x="470" y="130" width="120" height="60" fill="#C8102E" fill-opacity="0.18" stroke="#C8102E" stroke-width="1.5"/>
<text x="530" y="124" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#C8102E">stable</text>
<!-- candidate dots -->
<circle cx="180" cy="160" r="8" fill="#545454" stroke="#2a1a0e" stroke-width="1"/>
<circle cx="530" cy="160" r="8" fill="#545454" stroke="#2a1a0e" stroke-width="1"/>

<!-- BOTTOM: near tie -->
<text x="40" y="246" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#2a1a0e">near tie &#8594; unstable, order-driven verdict</text>
<rect x="40" y="258" width="620" height="130" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
<line x1="80" y1="338" x2="620" y2="338" stroke="#545454" stroke-width="1.5"/>
<text x="70" y="364" font-family="'JetBrains Mono',monospace" font-size="11" fill="#545454">lower</text>
<text x="620" y="364" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="11" fill="#545454">higher quality</text>
<!-- unstable verdict zone spanning both near-center markers (secondary) -->
<rect x="312" y="306" width="100" height="64" fill="#545454" fill-opacity="0.18" stroke="#545454" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="362" y="300" text-anchor="middle" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454">unstable</text>
<!-- nearly coincident dots -->
<circle cx="348" cy="338" r="8" fill="#545454" stroke="#2a1a0e" stroke-width="1"/>
<circle cx="376" cy="338" r="8" fill="#545454" stroke="#2a1a0e" stroke-width="1"/>
<!-- oscillation glyph (uncertainty, not a dual-headed arrow) -->
<path d="M330,290 q11,-12 22,0 q11,12 22,0 q11,-12 22,0" fill="none" stroke="#D4D4D4" stroke-width="1.5"/>
</svg>
