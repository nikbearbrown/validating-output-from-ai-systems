<!-- Three Properties of a Citation | Book: Validating Output from AI Systems | Chapter: 04-validating-factual-claims | Figure: 01 | Generated: 2026-05-29 | Source: pantry/04-validating-factual-claims-cajal.md -->
<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-01 fig-desc-01"><title id="fig-title-01">Three Properties of a Citation: Exists, Supports, Correct</title><desc id="fig-desc-01">A citation token threads downward through three independent gate-bands ordered by increasing difficulty: existence (mechanical), support (judgment), correctness (domain knowledge). Each band has a pass-down and fail-sideways fork; a token can pass one and fail another.</desc><metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="04-validating-factual-claims" figure-number="01" date-generated="2026-05-29"/></metadata><rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
<defs>
<marker id="arrow04a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a1a0e"/></marker>
<marker id="arrowred04a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C8102E"/></marker>
<marker id="arrowink04a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a1a0e"/></marker>
</defs>
<text x="40" y="40" font-family="'EB Garamond',Georgia,serif" font-size="20" fill="#2a1a0e">Three properties of a citation</text>
<text x="40" y="62" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#545454">Three independent checks, ordered by how mechanizable they are</text>

<!-- vertical mechanizability label -->
<text x="22" y="250" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454" transform="rotate(-90 22 250)">harder to mechanize  →</text>

<!-- entry token + vertical thread -->
<rect x="120" y="92" width="40" height="26" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1.2"/>
<line x1="135" y1="98" x2="135" y2="112" stroke="#545454" stroke-width="1"/>
<line x1="128" y1="102" x2="152" y2="102" stroke="#545454" stroke-width="1"/>
<line x1="128" y1="108" x2="148" y2="108" stroke="#545454" stroke-width="1"/>
<text x="180" y="109" font-family="'JetBrains Mono',monospace" font-size="11" fill="#545454">citation</text>
<line x1="140" y1="118" x2="140" y2="138" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow04a)"/>

<!-- Band 1: existence (solid edge, mechanical) -->
<rect x="60" y="142" width="380" height="56" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="2"/>
<text x="78" y="167" font-family="'EB Garamond',Georgia,serif" font-size="15" fill="#2a1a0e">1 · Exists</text>
<text x="78" y="186" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454">mechanical — the source is real and findable</text>
<text x="370" y="158" font-family="'JetBrains Mono',monospace" font-size="9" fill="#545454" text-anchor="end">solid = mechanical</text>
<!-- fork 1 -->
<line x1="140" y1="198" x2="140" y2="222" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow04a)"/>
<text x="148" y="216" font-family="'JetBrains Mono',monospace" font-size="10" fill="#545454">pass</text>
<line x1="440" y1="170" x2="490" y2="170" stroke="#C8102E" stroke-width="1.5" marker-end="url(#arrowred04a)"/>
<text x="496" y="174" font-family="'JetBrains Mono',monospace" font-size="10" fill="#C8102E">fail</text>

<!-- Band 2: support (dashed edge, judgment) -->
<rect x="60" y="226" width="380" height="56" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="78" y="251" font-family="'EB Garamond',Georgia,serif" font-size="15" fill="#2a1a0e">2 · Supports</text>
<text x="78" y="270" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454">judgment — it actually backs the claim made</text>
<text x="370" y="242" font-family="'JetBrains Mono',monospace" font-size="9" fill="#545454" text-anchor="end">dashed = judgment</text>
<line x1="140" y1="282" x2="140" y2="306" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow04a)"/>
<text x="148" y="300" font-family="'JetBrains Mono',monospace" font-size="10" fill="#545454">pass</text>
<line x1="440" y1="254" x2="490" y2="254" stroke="#C8102E" stroke-width="1.5" marker-end="url(#arrowred04a)"/>
<text x="496" y="258" font-family="'JetBrains Mono',monospace" font-size="10" fill="#C8102E">fail</text>

<!-- Band 3: correctness (dotted edge, domain) -->
<rect x="60" y="310" width="380" height="56" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1.5" stroke-dasharray="1.5 4"/>
<text x="78" y="335" font-family="'EB Garamond',Georgia,serif" font-size="15" fill="#2a1a0e">3 · Correct</text>
<text x="78" y="354" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454">domain knowledge — the source is itself right</text>
<text x="370" y="326" font-family="'JetBrains Mono',monospace" font-size="9" fill="#545454" text-anchor="end">dotted = domain</text>
<line x1="140" y1="366" x2="140" y2="392" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrowink04a)"/>
<text x="148" y="386" font-family="'JetBrains Mono',monospace" font-size="10" fill="#2a1a0e">accept</text>
<line x1="440" y1="338" x2="490" y2="338" stroke="#C8102E" stroke-width="1.5" marker-end="url(#arrowred04a)"/>
<text x="496" y="342" font-family="'JetBrains Mono',monospace" font-size="10" fill="#C8102E">fail</text>

<text x="540" y="170" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#2a1a0e">Independent</text>
<text x="540" y="186" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454">axes: passing</text>
<text x="540" y="202" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454">one says</text>
<text x="540" y="218" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454">nothing about</text>
<text x="540" y="234" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454">the others.</text>
</svg>
