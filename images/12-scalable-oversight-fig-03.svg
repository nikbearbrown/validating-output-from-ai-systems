<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-03 fig-desc-03"><title id="fig-title-03">The Debate Protocol: Two Arguers, One Weaker Judge</title><desc id="fig-desc-03">Two AI debaters argue opposing answers and rebut each other, exposing errors. A smaller, weaker judge reads only the exchange and renders a verdict. Hidden evidence feeds the debaters but not the judge, creating an information asymmetry.</desc><metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book-slug="validating-output-from-ai-systems" chapter="12-scalable-oversight" figure-number="03" date-generated="2026-05-29"/></metadata><rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
