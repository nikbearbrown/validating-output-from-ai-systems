<marker id="arrowink12c" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a1a0e"/></marker>
</defs>
<text x="40" y="40" font-family="'EB Garamond',Georgia,serif" font-size="20" fill="#2a1a0e">The debate protocol</text>
<text x="40" y="62" font-family="'Inter',-apple-system,sans-serif" font-size="12" fill="#545454">Two arguers expose each other&#8217;s errors; a weaker judge who cannot see the evidence decides</text>

<!-- hidden evidence box (far left) -->
<rect x="40" y="180" width="86" height="60" fill="#F5F5F5" stroke="#545454" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="83" y="206" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454" text-anchor="middle">hidden</text>
<text x="83" y="222" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454" text-anchor="middle">evidence</text>

<!-- debater A (top) -->
<rect x="210" y="100" width="140" height="60" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="2"/>
<text x="280" y="126" font-family="'EB Garamond',Georgia,serif" font-size="14" fill="#2a1a0e" text-anchor="middle">Debater A</text>
<text x="280" y="146" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#545454" text-anchor="middle">argues answer A</text>

<!-- debater B (bottom) -->
<rect x="210" y="260" width="140" height="60" fill="#F5F5F5" stroke="#C8102E" stroke-width="2"/>
<text x="280" y="286" font-family="'EB Garamond',Georgia,serif" font-size="14" fill="#2a1a0e" text-anchor="middle">Debater B</text>
<text x="280" y="306" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#C8102E" text-anchor="middle">argues answer B</text>

<!-- evidence feeds debaters only -->
<line x1="126" y1="200" x2="208" y2="140" stroke="#545454" stroke-width="1" marker-end="url(#arrow12c)"/>
<line x1="126" y1="220" x2="208" y2="282" stroke="#545454" stroke-width="1" marker-end="url(#arrow12c)"/>

<!-- reciprocal rebuttal arrows -->
<path d="M300,160 C 330,190 330,230 300,258" fill="none" stroke="#545454" stroke-width="1.2" marker-end="url(#arrow12c)"/>
<path d="M260,260 C 230,232 230,188 260,162" fill="none" stroke="#545454" stroke-width="1.2" marker-end="url(#arrow12c)"/>
<text x="358" y="214" font-family="'JetBrains Mono',monospace" font-size="10" fill="#545454">rebut</text>

<!-- judge node (smaller circle, weaker) -->
<circle cx="500" cy="210" r="42" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1.5"/>
<text x="500" y="206" font-family="'EB Garamond',Georgia,serif" font-size="13" fill="#2a1a0e" text-anchor="middle">Judge</text>
<text x="500" y="224" font-family="'Inter',-apple-system,sans-serif" font-size="10" fill="#545454" text-anchor="middle">weaker</text>

<!-- debaters to judge -->
<line x1="350" y1="130" x2="462" y2="195" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#arrowink12c)"/>
<line x1="350" y1="290" x2="462" y2="225" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#arrowink12c)"/>

<!-- verdict marker -->
<line x1="542" y1="210" x2="600" y2="210" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#arrowink12c)"/>
<rect x="608" y="194" width="50" height="34" fill="#2a1a0e"/>
<text x="633" y="216" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">verdict</text>

<!-- asymmetry note -->
<text x="500" y="306" font-family="'Inter',-apple-system,sans-serif" font-size="11" fill="#C8102E" text-anchor="middle">judge never sees the evidence</text>
<text x="83" y="262" font-family="'JetBrains Mono',monospace" font-size="9" fill="#545454" text-anchor="middle">feeds debaters,</text>
<text x="83" y="274" font-family="'JetBrains Mono',monospace" font-size="9" fill="#545454" text-anchor="middle">not the judge</text>
